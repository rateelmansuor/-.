<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مفكرتي المدرسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5FF; --card: #FFFFFF; --ink: #1B2250; --muted: #6B7299; --line: #E1E5F7;
    --hero: #1E2A5A; --accent: #F0457A; --accent-ink: #FFFFFF;
    --good: #1FB58F; --good-bg: #DDF7EF; --bad: #E5484D; --bad-bg: #FDE8E8;
    --sun: #FFC93C; --chip: #EEF0FC;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11142B; --card: #1A1F42; --ink: #EEF0FF; --muted: #9AA2D0; --line: #2B3260;
      --hero: #262F6B; --accent: #FF6B98; --accent-ink: #2A0A17;
      --good: #4FD9B3; --good-bg: #153B33; --bad: #FF8A8E; --bad-bg: #40202A; --chip: #232A57;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11142B; --card: #1A1F42; --ink: #EEF0FF; --muted: #9AA2D0; --line: #2B3260;
    --hero: #262F6B; --accent: #FF6B98; --accent-ink: #2A0A17;
    --good: #4FD9B3; --good-bg: #153B33; --bad: #FF8A8E; --bad-bg: #40202A; --chip: #232A57;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Cairo", "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif; line-height: 1.6; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #app { max-width: 580px; margin: 0 auto; padding: 14px 14px 150px; }

  /* Hero */
  .hero { background: var(--hero); color: #fff; border-radius: 22px; padding: 14px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { flex: none; width: 96px; height: 70px; border-radius: 14px; background: #fff; padding: 4px; display: grid; place-items: center; }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 800; line-height: 1.35; }
  .brand p { margin: 0; font-size: .8rem; opacity: .85; }
  .stats { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pill { background: rgba(255,255,255,.14); border-radius: 99px; padding: 3px 12px; font-size: .85rem; font-weight: 600; }

  .greet { margin: 4px 4px 14px; }
  .greet h2 { margin: 0; font-size: 1.35rem; font-weight: 800; }
  .greet p { margin: 0; color: var(--muted); font-size: .85rem; }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 1.02rem; font-weight: 700; }

  /* Ring */
  .ringrow { display: flex; align-items: center; gap: 16px; }
  .ring { flex: none; width: 96px; height: 96px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.25rem; font-weight: 800; }
  .ringrow p { margin: 0; }
  .ringrow .big { font-size: 1.15rem; font-weight: 700; }
  .ringrow .small { color: var(--muted); font-size: .88rem; }

  /* Homework card */
  .hw { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; border-inline-start: 6px solid var(--sc, var(--line)); }
  .chk { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2.5px solid var(--sc); background: transparent; display: grid; place-items: center; color: transparent; font-size: 1.1rem; font-weight: 800; margin-top: 2px; }
  .hw.done .chk { background: var(--good); border-color: var(--good); color: #fff; }
  .hw .body { flex: 1; min-width: 0; text-align: start; background: none; border: 0; padding: 0; }
  .hw .t { display: block; font-weight: 700; overflow-wrap: anywhere; }
  .hw.done .t { text-decoration: line-through; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
  .tag { font-size: .76rem; font-weight: 600; border-radius: 99px; padding: 1px 10px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .tag.sub { background: var(--sc); color: #fff; }
  .tag.late { background: var(--bad-bg); color: var(--bad); }
  .tag.today { background: var(--accent); color: var(--accent-ink); }
  .tag.hot { background: #FFE9B8; color: #8A5A00; }
  .note { margin: 4px 0 0; font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }

  .sec { margin: 18px 4px 8px; font-size: .95rem; font-weight: 800; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .sec span { background: var(--chip); border-radius: 99px; padding: 0 9px; font-size: .78rem; }
  .sec.late { color: var(--bad); }

  .empty { text-align: center; padding: 26px 12px; color: var(--muted); border: 2px dashed var(--line); border-radius: 18px; margin-bottom: 14px; }
  .empty b { display: block; font-size: 2rem; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 14px; font-size: .88rem; font-weight: 600; min-height: 36px; }
  .chip:disabled { opacity: .5; cursor: default; }
  .chip.dashed { border-style: dashed; color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--cc, var(--hero)); border-color: var(--cc, var(--hero)); color: #fff; }

  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 12px; font-weight: 700; min-height: 48px; background: var(--accent); color: var(--accent-ink); text-align: center; }
  .btn.alt { background: var(--chip); color: var(--ink); }
  .btn.danger { background: var(--bad-bg); color: var(--bad); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* Focus */
  .timer { text-align: center; }
  .timer .tm { font-size: 3rem; font-weight: 800; letter-spacing: 2px; direction: ltr; line-height: 1.2; }
  .timer .mode { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
  select, input[type="text"], input[type="date"], textarea { width: 100%; background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  textarea { resize: vertical; min-height: 64px; }
  label.f { display: block; font-size: .82rem; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }

  /* Subjects */
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .sbox { background: var(--sc); color: #fff; border-radius: 18px; padding: 14px 12px; text-align: start; border: 0; min-height: 96px; }
  .sbox b { font-size: 1.8rem; display: block; line-height: 1.2; }
  .sbox span { font-weight: 700; display: block; }
  .sbox small { opacity: .9; }

  /* Me */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--chip); border-radius: 14px; padding: 10px 12px; }
  .stat b { display: block; font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
  .stat span { font-size: .82rem; color: var(--muted); }
  .lvlbar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .lvlbar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
  .week { display: flex; gap: 8px; align-items: flex-end; height: 120px; margin-top: 6px; }
  .week div { flex: 1; text-align: center; font-size: .72rem; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .week i { display: block; background: var(--accent); border-radius: 6px 6px 2px 2px; min-height: 4px; margin-bottom: 4px; }
  .week em { font-style: normal; font-weight: 700; color: var(--ink); }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge { text-align: center; background: var(--chip); border-radius: 14px; padding: 10px 4px; font-size: .78rem; font-weight: 600; }
  .badge b { display: block; font-size: 1.7rem; line-height: 1.2; }
  .badge.lock { opacity: .4; filter: grayscale(1); }

  /* Nav + FAB */
  nav.bar { position: fixed; inset-inline: 0; bottom: 0; background: var(--card); border-top: 1.5px solid var(--line); display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
  nav.bar button { flex: 1; background: none; border: 0; border-radius: 12px; padding: 4px 0; font-size: .75rem; font-weight: 700; color: var(--muted); min-height: 52px; }
  nav.bar button b { display: block; font-size: 1.35rem; line-height: 1.2; }
  nav.bar button[aria-current="page"] { color: var(--accent); }
  .fab { position: fixed; inset-inline-start: 18px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 2rem; font-weight: 700; box-shadow: 0 6px 18px rgba(240,69,122,.45); z-index: 21; line-height: 1; }

  /* Sheet */
  .ov { position: fixed; inset: 0; background: rgba(10,14,40,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 580px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
  .sheet h3 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 800; }
  .wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .emo { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 1.4rem; }
  .emo[aria-pressed="true"] { border-color: var(--accent); }
  .col { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; background: var(--cc); }
  .col[aria-pressed="true"] { border-color: var(--ink); }

  #toast { position: fixed; inset-inline: 0; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; justify-content: center; z-index: 60; pointer-events: none; }
  #toast div { background: var(--hero); color: #fff; border-radius: 99px; padding: 8px 18px; font-weight: 700; font-size: .92rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); max-width: 92vw; text-align: center; }
  #cf { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
  .sched { display: grid; grid-template-columns: 26px repeat(5, 1fr); gap: 5px; }
  .sched .h { text-align: center; font-size: .72rem; font-weight: 800; color: var(--muted); padding: 4px 0; border-bottom: 3px solid transparent; }
  .sched .h.now { color: var(--accent); border-bottom-color: var(--accent); }
  .sched .n { display: grid; place-items: center; font-weight: 800; color: var(--muted); font-size: .85rem; }
  .cell { border: 0; border-radius: 10px; min-height: 62px; padding: 4px 2px; background: var(--sc); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .62rem; font-weight: 700; line-height: 1.25; text-align: center; overflow: hidden; }
  .cell b { font-size: 1.15rem; line-height: 1; }
  .cell span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .cell.blank { background: transparent; border: 2px dashed var(--line); color: var(--muted); font-size: 1.2rem; font-weight: 400; }
  .rings { display: flex; justify-content: space-around; text-align: center; }
  .rbox { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); font-weight: 700; }
  .bar2 { margin: 12px 0; }
  .bar2 .bl { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 700; }
  .bar2 small { color: var(--muted); font-weight: 600; }
  .bar2 .bt { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .bar2 .bt i { display: block; height: 100%; border-radius: 99px; }
  .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .heat i { aspect-ratio: 1; border-radius: 7px; background: var(--line); display: block; }
  .heat i.l1 { background: var(--good); opacity: .35; }
  .heat i.l2 { background: var(--good); opacity: .65; }
  .heat i.l3 { background: var(--good); }
  .heat i.now { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { color: var(--muted); font-size: .8rem; margin: 8px 0 0; }
  .stars { display: flex; gap: 6px; justify-content: center; margin: 4px 0 12px; }
  .stars button { background: none; border: 0; font-size: 2rem; line-height: 1; padding: 2px 4px; filter: grayscale(1); opacity: .45; min-width: 44px; min-height: 44px; }
  .stars button.on { filter: none; opacity: 1; }
  .foot { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 24px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div id="sheetroot"></div>
<div id="toast"></div>
<canvas id="cf"></canvas>

    h += '<button class="chip dashed" data-act="slotPick" data-id="">بدون مادة</button></div><button class="btn alt" data-act="sheetClose" style="margin-top:16px">إغلاق</button></div></div>';

  function openSheet() { if (draft.kind === "hw") sheetHw(); else if (draft.kind === "slot") sheetSlot(); else sheetSub(); }

  /* ======= التركيز ======= */
  function startTick() {
    if (FOCUS.t) clearInterval(FOCUS.t);
    FOCUS.t = setInterval(function () {
      FOCUS.remain = Math.max(0, Math.round((FOCUS.end - Date.now()) / 1000));
      var el = document.getElementById("tm"); if (el) el.textContent = fmtT(FOCUS.remain);
      var f = document.getElementById("tfill"); if (f) f.style.width = tpct() + "%";
      if (FOCUS.remain <= 0) focusDone();
    }, 500);
  }
  function stopTick() { if (FOCUS.t) { clearInterval(FOCUS.t); FOCUS.t = null; } }
  function focusDone() {
    stopTick(); FOCUS.running = false;
    if (FOCUS.mode === "work") {
      var k = todayS(); S.focus[k] = (S.focus[k] || 0) + FOCUS.len; S.sessions = (S.sessions || 0) + 1; save();
      toast("أحسنتِ! أنهيتِ جلسة تركيز. خذي استراحة."); FOCUS.mode = "break"; FOCUS.remain = breakMin() * 60;
    } else { toast("انتهت الاستراحة. جاهزة لجلسة جديدة؟"); FOCUS.mode = "work"; FOCUS.remain = FOCUS.len * 60; }
    beep();
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    render();
  }

  /* ======= المشاركة ======= */
  function shareText() {
    var lines = ["📚 واجباتي المتبقية:"];
    S.hw.filter(function (x) { return !x.done; }).sort(sortHw).forEach(function (x) { var s = sub(x.sid); lines.push("• " + s.emoji + " " + s.name + ": " + x.title + " (" + dueLabel(x) + ")"); });
    return lines.join("\n");
  }
  function copyText(txt, msg) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); toast(ok ? msg : "تعذر النسخ");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast(msg); }, fallback); else fallback();
  }
  function doShare() {
    var txt = shareText();
    if (navigator.share) { navigator.share({ text: txt }).catch(function () {}); return; }
    copyText(txt, "تم نسخ القائمة");
  }

  /* ======= الأحداث ======= */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
    if (act === "ovClose") { if (e.target === el) sheetClose(); return; }
    if (act !== "dDelete" && act !== "reset" && act !== "clearDone" && act !== "dSubDel" && act !== "bkRestore" && act !== "schedClear") pendingDel = "";
    switch (act) {
      case "nav": view = id; render(); window.scrollTo(0, 0); break;
      case "toggle": toggle(id); break;
      case "edit": var h = findHw(id); if (h) { draft = { kind: "hw", id: h.id, title: h.title, sid: h.sid, due: h.due || "", prio: h.prio || 0, note: h.note || "" }; openSheet(); } break;
      case "newHw": draft = { kind: "hw", id: "", title: "", sid: filterSid !== "all" && view === "list" ? filterSid : "", due: "", prio: 0, note: "" }; openSheet(); break;
      case "filter": filterSid = id; render(); break;
      case "toggleDone": showDone = !showDone; render(); break;
      case "clearDone":
        if (pendingDel !== "clearDone") { pendingDel = "clearDone"; render(); break; }
        S.hw = S.hw.filter(function (x) { return !x.done; }); pendingDel = ""; save(); render(); break;
      case "share": doShare(); break;
      case "saveName": var n1 = document.getElementById("nm"); if (n1 && n1.value.trim()) { S.name = n1.value.trim(); save(); render(); } break;
      case "saveName2": var n2 = document.getElementById("nm2"); if (n2) { S.name = n2.value.trim(); save(); toast("تم الحفظ"); render(); } break;
      case "reset":
        if (pendingDel !== "reset") { pendingDel = "reset"; render(); break; }
        try { localStorage.removeItem(KEY); } catch (er) {}
        S = { name: "", subjects: [], hw: [], points: 0, log: {}, focus: {} }; normalize(); save(); pendingDel = ""; view = "home"; render(); break;
      case "fstart":
        if (FOCUS.running) { FOCUS.running = false; stopTick(); FOCUS.remain = Math.max(0, Math.round((FOCUS.end - Date.now()) / 1000)); render(); }
        else { var fs = document.getElementById("fsel"); if (fs) FOCUS.hwId = fs.value; FOCUS.running = true; FOCUS.end = Date.now() + FOCUS.remain * 1000; render(); }
        break;
      case "freset": stopTick(); FOCUS.running = false; FOCUS.mode = "work"; FOCUS.remain = FOCUS.len * 60; render(); break;
      case "flen": if (!FOCUS.running) { FOCUS.len = +id; FOCUS.mode = "work"; FOCUS.remain = FOCUS.len * 60; render(); } break;
      case "bkCopy": copyText(encode(), "تم نسخ الرمز، احفظيه في مكان آمن"); break;
      case "bkRestore":
        var code = document.getElementById("bkIn"), o2 = code ? decode(code.value) : null;
        if (!o2) { toast("الرمز غير صحيح"); break; }
        if (pendingDel !== "bk") { pendingDel = "bk"; var keep = code.value; render(); var c2 = document.getElementById("bkIn"); if (c2) c2.value = keep; toast("سيستبدل هذا بياناتكِ الحالية. اضغطي مرة أخرى للتأكيد"); break; }
        S = o2; normalize(); pendingDel = ""; save(); view = "home"; render(); toast("تمت استعادة بياناتكِ"); break;
      case "slot": draft = { kind: "slot", day: +el.getAttribute("data-d"), period: +el.getAttribute("data-p") }; openSheet(); break;
      case "slotPick": S.sched[draft.day][draft.period] = id; save(); sheetClose(); render(); break;
      case "schedClear":
        if (pendingDel !== "sched") { pendingDel = "sched"; render(); break; }
        for (var dd2 = 0; dd2 < 5; dd2++) S.sched[dd2] = ["", "", "", "", "", "", ""];
        pendingDel = ""; save(); render(); toast("تم مسح الجدول"); break;
      case "rate":
        var cm1 = document.getElementById("cm"); CM = cm1 ? cm1.value : CM; RATE = (RATE === +id) ? 0 : +id; render();
        var cm2 = document.getElementById("cm"); if (cm2) cm2.value = CM; break;
      case "cmSend":
        var cm3 = document.getElementById("cm"), txt3 = cm3 ? cm3.value.trim() : "";
        if (!txt3 && !RATE) { toast("اكتبي تعليقًا أو اختاري تقييمًا"); break; }
        var msg3 = "تعليق على مفكرتي المدرسية\n" + (S.name ? "الاسم: " + S.name + "\n" : "") + (RATE ? "التقييم: " + RATE + " من 5\n" : "") + (txt3 ? "التعليق: " + txt3 : "");
        if (WHATSAPP) {
          var a3 = document.createElement("a"); a3.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg3); a3.target = "_blank"; a3.rel = "noopener";
          document.body.appendChild(a3); a3.click(); document.body.removeChild(a3);
        } else if (navigator.share) { navigator.share({ text: msg3 }).catch(function () {}); }
        else copyText(msg3, "تم نسخ تعليقكِ");
        RATE = 0; CM = ""; if (cm3) cm3.value = ""; toast("شكرًا لرأيكِ 💗"); render(); break;
      case "dAddToggle": syncDraft(); draft.addingSub = !draft.addingSub; sheetHw(); break;
      case "dAddSub":
        var nin = document.getElementById("dNewSub"), nn = nin ? nin.value.trim() : "";
        if (!nn) { toast("اكتبي اسم المادة"); break; }
        syncDraft();
        var ns = { id: uid(), name: nn, emoji: "📌", color: COLORS[S.subjects.length % COLORS.length] };
        S.subjects.push(ns); draft.sid = ns.id; draft.addingSub = false; save(); sheetHw(); render(); toast("تمت إضافة المادة"); break;
      /* نافذة الواجب */
      case "sheetClose": sheetClose(); break;
      case "dSub": syncDraft(); draft.sid = id; sheetHw(); break;
      case "dDue": syncDraft(); draft.due = id; sheetHw(); break;
      case "dPrio": syncDraft(); draft.prio = +id; sheetHw(); break;
      case "dSave":
        syncDraft();
        if (!draft.title.trim()) { toast("اكتبي اسم الواجب أولًا"); break; }
        if (!draft.sid) { toast("اختاري المادة"); break; }
        if (draft.id) {
          var ex = findHw(draft.id);
          if (ex) { ex.title = draft.title.trim(); ex.sid = draft.sid; ex.due = draft.due; ex.prio = draft.prio; ex.note = draft.note.trim(); }
        } else {
          S.hw.push({ id: uid(), title: draft.title.trim(), sid: draft.sid, due: draft.due, prio: draft.prio, note: draft.note.trim(), done: false });
          toast("تمت الإضافة");
        }
        save(); sheetClose(); render(); break;
      case "dDelete":
        if (pendingDel !== "hw") { syncDraft(); pendingDel = "hw"; sheetHw(); break; }
        S.hw = S.hw.filter(function (x) { return x.id !== draft.id; }); pendingDel = ""; save(); sheetClose(); render(); break;
      /* نافذة المادة */
      case "subOpen": var sb = sub(id); draft = { kind: "sub", id: sb.id, name: sb.name, emoji: sb.emoji, color: sb.color }; openSheet(); break;
      case "subNew": draft = { kind: "sub", id: "", name: "", emoji: EMOJIS[0], color: COLORS[5] }; openSheet(); break;
      case "dEmo": syncDraft(); draft.emoji = id; sheetSub(); break;
      case "dCol": syncDraft(); draft.color = id; sheetSub(); break;
      case "dSubSave":
        syncDraft();
        if (!draft.name.trim()) { toast("اكتبي اسم المادة"); break; }
        if (draft.id) { var se = sub(draft.id); se.name = draft.name.trim(); se.emoji = draft.emoji; se.color = draft.color; }
        else S.subjects.push({ id: uid(), name: draft.name.trim(), emoji: draft.emoji, color: draft.color });
        save(); sheetClose(); render(); break;
      case "dSubDel":
        if (pendingDel !== "sub") { syncDraft(); pendingDel = "sub"; sheetSub(); break; }
        S.subjects = S.subjects.filter(function (x) { return x.id !== draft.id; });
        for (var dd3 = 0; dd3 < 5; dd3++) S.sched[dd3] = S.sched[dd3].map(function (x) { return x === draft.id ? "" : x; });
        if (filterSid === draft.id) filterSid = "all";
        pendingDel = ""; save(); sheetClose(); render(); break;
    }
  });
  document.addEventListener("change", function (e) { if (e.target && e.target.id === "fsel") FOCUS.hwId = e.target.value; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && draft) sheetClose(); });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && FOCUS.running) {
      FOCUS.remain = Math.max(0, Math.round((FOCUS.end - Date.now()) / 1000));
      if (FOCUS.remain <= 0) focusDone(); else { var el = document.getElementById("tm"); if (el) el.textContent = fmtT(FOCUS.remain); }
    }
  });

  if (GOATCOUNTER) {
    try {
      var gc = document.createElement("script");
      gc.async = true; gc.src = "https://gc.zgo.at/count.js";
      gc.setAttribute("data-goatcounter", "https://" + GOATCOUNTER + ".goatcounter.com/count");
      document.head.appendChild(gc);
    } catch (e) {}
  }
  load();
  recordOpen();
  render();
  restoreFromIdb();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
</body>
</html>
